<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Pong — Arcade</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07111f;
      color: #eef7ff;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(32, 90, 139, .25), transparent 55%),
        #07111f;
    }

    .game-shell { width: min(100%, 980px); }

    header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin: 0 2px 16px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #63e6d1;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -.06em; }

    .scoreboard {
      display: flex;
      align-items: center;
      gap: clamp(12px, 4vw, 30px);
      padding: 9px 18px;
      border: 1px solid #20354a;
      border-radius: 14px;
      background: rgba(15, 30, 47, .8);
      font-variant-numeric: tabular-nums;
    }

    .score { min-width: 32px; text-align: center; font-size: 1.8rem; font-weight: 800; }
    .score-label { display: block; color: #8ca4bb; font-size: .62rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .separator { color: #49627a; font-weight: 700; }

    .court-wrap {
      overflow: hidden;
      border: 1px solid #28435b;
      border-radius: 18px;
      background: #0a1928;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35), 0 0 50px rgba(48, 199, 186, .06);
    }

    canvas { display: block; width: 100%; height: auto; aspect-ratio: 900 / 560; cursor: none; touch-action: none; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 15px;
    }

    .status { display: flex; align-items: center; gap: 9px; color: #a9bed1; font-size: .88rem; }
    .status::before { width: 8px; height: 8px; border-radius: 50%; background: #63e6d1; box-shadow: 0 0 12px #63e6d1; content: ""; }
    .buttons { display: flex; gap: 9px; }

    button {
      padding: 9px 15px;
      border: 1px solid #304a61;
      border-radius: 10px;
      background: #10243a;
      color: #eef7ff;
      font: inherit;
      font-size: .84rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .16s ease, transform .16s ease;
    }
    button:hover { transform: translateY(-1px); background: #193550; }
    button:focus-visible { outline: 2px solid #63e6d1; outline-offset: 3px; }
    button.primary { border-color: #63e6d1; background: #63e6d1; color: #07111f; }
    button.primary:hover { background: #8af3e3; }

    .help { margin: 14px 2px 0; color: #7890a6; font-size: .78rem; line-height: 1.6; }
    kbd { padding: 2px 6px; border: 1px solid #334b61; border-radius: 5px; background: #10243a; color: #dce9f5; font: inherit; font-size: .72rem; }

    @media (max-width: 560px) {
      body { padding: 20px 12px; }
      header { align-items: center; }
      .scoreboard { gap: 10px; padding: 7px 10px; }
      .score { min-width: 24px; font-size: 1.45rem; }
      .score-label { font-size: .54rem; }
      .toolbar { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header>
      <div>
        <p class="eyebrow">Arcade classic</p>
        <h1>Pong</h1>
      </div>
      <div class="scoreboard" aria-label="Scoreboard">
        <div class="score"><span class="score-label">You</span><span id="player-score">0</span></div>
        <span class="separator" aria-hidden="true">:</span>
        <div class="score"><span class="score-label">Computer</span><span id="computer-score">0</span></div>
      </div>
    </header>

    <div class="court-wrap">
      <canvas id="game" width="900" height="560" aria-label="Pong game. Move your mouse over the court or use the up and down arrow keys to control the left paddle."></canvas>
    </div>

    <div class="toolbar">
      <div class="status" id="status" aria-live="polite">First to 5 points wins</div>
      <div class="buttons">
        <button id="pause-button" type="button">Pause</button>
        <button id="restart-button" class="primary" type="button">Restart</button>
      </div>
    </div>
    <p class="help">Move your mouse over the court or use <kbd>↑</kbd> and <kbd>↓</kbd> to move your paddle. Press <kbd>Space</kbd> to pause or resume.</p>
  </main>

  <script>
    (() => {
      const canvas = document.querySelector('#game');
      const ctx = canvas.getContext('2d');
      const playerScoreEl = document.querySelector('#player-score');
      const computerScoreEl = document.querySelector('#computer-score');
      const statusEl = document.querySelector('#status');
      const pauseButton = document.querySelector('#pause-button');
      const W = canvas.width;
      const H = canvas.height;
      const paddle = { width: 13, height: 100, inset: 34, speed: 470 };
      const ballRadius = 9;
      const winningScore = 5;
      const keys = new Set();
      let playerY = (H - paddle.height) / 2;
      let computerY = playerY;
      let ball = { x: W / 2, y: H / 2, vx: 350, vy: 150 };
      let playerScore = 0;
      let computerScore = 0;
      let paused = false;
      let finished = false;
      let lastTime = 0;
      let serveTimer = 0;

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

      function serve(direction) {
        ball = {
          x: W / 2,
          y: H / 2,
          vx: 350 * direction,
          vy: (Math.random() * 220 - 110) || 80
        };
        serveTimer = 0.65;
      }

      function resetGame() {
        playerScore = 0;
        computerScore = 0;
        playerY = computerY = (H - paddle.height) / 2;
        paused = false;
        finished = false;
        serve( Math.random() < 0.5 ? -1 : 1 );
        playerScoreEl.textContent = '0';
        computerScoreEl.textContent = '0';
        statusEl.textContent = 'First to 5 points wins';
        pauseButton.textContent = 'Pause';
      }

      function togglePause() {
        if (finished) return;
        paused = !paused;
        pauseButton.textContent = paused ? 'Resume' : 'Pause';
        statusEl.textContent = paused ? 'Paused — press Space or Resume to continue' : 'First to 5 points wins';
      }

      function scorePoint(forPlayer) {
        if (forPlayer) {
          playerScore++;
          playerScoreEl.textContent = String(playerScore);
        } else {
          computerScore++;
          computerScoreEl.textContent = String(computerScore);
        }
        if (playerScore >= winningScore || computerScore >= winningScore) {
          finished = true;
          statusEl.textContent = playerScore > computerScore ? 'You win! Press Restart to play again.' : 'Computer wins — press Restart for a rematch.';
          return;
        }
        statusEl.textContent = forPlayer ? 'Point for you!' : 'Point for the computer';
        serve(forPlayer ? 1 : -1);
      }

      function update(dt) {
        const direction = (keys.has('ArrowDown') || keys.has('s') ? 1 : 0) - (keys.has('ArrowUp') || keys.has('w') ? 1 : 0);
        playerY = clamp(playerY + direction * paddle.speed * dt, 0, H - paddle.height);

        // The computer tracks the ball, but moves slowly enough to remain beatable.
        const targetY = ball.y - paddle.height / 2;
        const aiStep = 340 * dt;
        computerY += clamp(targetY - computerY, -aiStep, aiStep);
        computerY = clamp(computerY, 0, H - paddle.height);

        if (serveTimer > 0) {
          serveTimer -= dt;
          return;
        }

        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        // Bounce off the top and bottom walls.
        if (ball.y - ballRadius <= 0) {
          ball.y = ballRadius;
          ball.vy = Math.abs(ball.vy);
        } else if (ball.y + ballRadius >= H) {
          ball.y = H - ballRadius;
          ball.vy = -Math.abs(ball.vy);
        }

        const playerX = paddle.inset;
        const computerX = W - paddle.inset - paddle.width;
        const hitsPlayer = ball.vx < 0 && ball.x - ballRadius <= playerX + paddle.width && ball.x + ballRadius >= playerX && ball.y + ballRadius >= playerY && ball.y - ballRadius <= playerY + paddle.height;
        const hitsComputer = ball.vx > 0 && ball.x + ballRadius >= computerX && ball.x - ballRadius <= computerX + paddle.width && ball.y + ballRadius >= computerY && ball.y - ballRadius <= computerY + paddle.height;

        if (hitsPlayer) {
          ball.x = playerX + paddle.width + ballRadius;
          bounceFromPaddle(playerY, -1);
        } else if (hitsComputer) {
          ball.x = computerX - ballRadius;
          bounceFromPaddle(computerY, 1);
        }

        if (ball.x + ballRadius < 0) scorePoint(false);
        else if (ball.x - ballRadius > W) scorePoint(true);
      }

      function bounceFromPaddle(paddleY, direction) {
        const relativeImpact = (ball.y - (paddleY + paddle.height / 2)) / (paddle.height / 2);
        const speed = Math.min(Math.hypot(ball.vx, ball.vy) * 1.055, 760);
        const angle = clamp(relativeImpact, -1, 1) * (Math.PI / 3);
        ball.vx = direction * speed * Math.cos(angle);
        ball.vy = speed * Math.sin(angle);
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#0a1928';
        ctx.fillRect(0, 0, W, H);

        // Dashed center line and subtle court glow.
        ctx.save();
        ctx.setLineDash([9, 13]);
        ctx.strokeStyle = 'rgba(125, 162, 190, .23)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(W / 2, 20);
        ctx.lineTo(W / 2, H - 20);
        ctx.stroke();
        ctx.restore();

        const playerX = paddle.inset;
        const computerX = W - paddle.inset - paddle.width;
        drawPaddle(playerX, playerY, '#63e6d1');
        drawPaddle(computerX, computerY, '#92b8ff');

        ctx.shadowColor = '#f6fbff';
        ctx.shadowBlur = 18;
        ctx.fillStyle = '#f6fbff';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ballRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        if (paused || finished) {
          ctx.fillStyle = 'rgba(4, 12, 21, .58)';
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = '#f2f8ff';
          ctx.textAlign = 'center';
          ctx.font = '800 34px system-ui, sans-serif';
          ctx.fillText(finished ? (playerScore > computerScore ? 'YOU WIN!' : 'COMPUTER WINS') : 'PAUSED', W / 2, H / 2);
          ctx.font = '500 15px system-ui, sans-serif';
          ctx.fillStyle = '#b7c9d9';
          ctx.fillText(finished ? 'Press Restart to play again' : 'Press Space to resume', W / 2, H / 2 + 31);
        }
      }

      function drawPaddle(x, y, color) {
        ctx.shadowColor = color;
        ctx.shadowBlur = 15;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(x, y, paddle.width, paddle.height, 7);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      function frame(time) {
        const dt = Math.min((time - lastTime) / 1000 || 0, 0.03);
        lastTime = time;
        if (!paused && !finished) update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      canvas.addEventListener('pointermove', (event) => {
        const rect = canvas.getBoundingClientRect();
        const scaleY = H / rect.height;
        playerY = clamp((event.clientY - rect.top) * scaleY - paddle.height / 2, 0, H - paddle.height);
      });

      window.addEventListener('keydown', (event) => {
        if (['ArrowUp', 'ArrowDown', ' '].includes(event.key)) event.preventDefault();
        if (event.key === ' ' && !event.repeat) togglePause();
        keys.add(event.key);
      });
      window.addEventListener('keyup', (event) => keys.delete(event.key));
      window.addEventListener('blur', () => keys.clear());
      pauseButton.addEventListener('click', togglePause);
      document.querySelector('#restart-button').addEventListener('click', resetGame);

      resetGame();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
